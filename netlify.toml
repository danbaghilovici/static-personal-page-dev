[build]
command = "hugo --gc --minify"
publish = "public"

[build.environment]
HUGO_VERSION = "0.111.2"
HUGO_EXTENDED = "true"
HUGO_ENV = "production"
HUGO_ENABLEGITINFO = "true"

[[redirects]]
from = "/en/*"
to = "/en/404.html"
status = 404

[[redirects]]
from = "/es/*"
to = "/es/404.html"
status = 404

[[redirects]]
from = "/ro/*"
to = "/ro/404.html"
status = 404

[[redirects]]
from = "/*"
to = "/404.html"
status = 404
